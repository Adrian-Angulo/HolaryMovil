name: Build iOS IPA

on:
  workflow_dispatch: # Te permite ejecutarlo con un botón en GitHub

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x' # o tu versión de Flutter
          channel: 'stable'
          
      - name: Instalar dependencias
        run: |
          cd FrontendMovil
          flutter pub get

      - name: Compilar iOS sin firma de pago
        run: |
          cd FrontendMovil
          flutter build ios --release --no-codesign
          
      - name: Empaquetar Payload (.ipa)
        run: |
          cd FrontendMovil/build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r Horaly.ipa Payload
          
      - name: Subir archivo IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Horaly-iOS-App
          path: FrontendMovil/build/ios/iphoneos/Horaly.ipa